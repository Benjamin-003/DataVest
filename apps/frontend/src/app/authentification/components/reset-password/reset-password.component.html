<div class="text-center">
  <img src="assets/logo.png" alt="logo" width="397" height="223" />
  <h1>Réinitialiser mon mot de passe</h1>
</div>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid mt-5 p-fluid">
    <div class="col-12 lg:col-offset-4 lg:col-4 shadow-2 bg-primary-300">
      <p-card>
        <div class="field mb-6">
          <span class="p-float-label mb-2">
            <input id="email" type="text" formControlName="email" pInputText />
            <label for="email">Email de connexion</label>
          </span>
          @if (email?.touched && email?.hasError('required')) {
            <div class="p-error"><small>Ce champ est obligatoire</small></div>
          }
          @if (email?.touched && email?.hasError('email')) {
            <div class="p-error"><small>Adresse email invalide</small></div>
          }
        </div>
        <div class="col-offset-3 col-6 flex flex-wrap gap-2">
          <button pButton pRipple [disabled]="form.invalid" [loading]="loading()"
            type="submit" label="Réinitialiser le mot de passe" class="p-button-raised mb-2">
          </button>
          <button pButton routerLink="./../connexion"
            label="Annuler" class="p-button-alert">
          </button>
        </div>
      </p-card>
    </div>
  </div>
</form>
<p-toast position="bottom-right"></p-toast>
