<h2>Informations du compte</h2>
<div class="grid p-fluid col-12 md:col-offset-4 md:col-4 justify-content-center">
  <p-dialog
    [showHeader]="false"
    [(visible)]="isVisible"
    [draggable]="false"
    [resizable]="false"
    [modal]="true"
  >
    <p>
      Souhaitez-vous vraiment supprimer votre compte Ottawa Pigeon ? <br />Cette
      action est irréversible et supprimera l'ensemble de vos données.
    </p>
    <p-footer>
      <div class="flex justify-content-around">
        <button type="button" pButton label="Non"
          [autofocus]="isVisible" (click)="isVisible = false">
        </button>
        <button type="button" pButton label="Oui"
          (click)="deleteAccount()">
        </button>
      </div>
    </p-footer>
  </p-dialog>

  <!-- ← ajout -->
  <button
    pButton
    pRipple
    (click)="exportData()"
    label="Exporter mes données"
    icon="pi pi-download"
    class="p-button-outlined p-button-info mb-2">
  </button>

  <button
    pButton
    pRipple
    (click)="isVisible = true"
    label="Supprimer mon compte"
    class="p-button-danger">
  </button>
</div>
