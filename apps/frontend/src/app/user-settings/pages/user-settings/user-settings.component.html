<div class="mx-2">
  <h1>Mon Profil</h1>
  <p>
    Vous pouvez utiliser cette page pour visualiser vos informations
    personnelles, modifier vos préférences et d'autres paramètres.
  </p>

  <!-- user() est un Signal → appelé avec () dans le template -->
  @if (user()) {

    <!-- Données personnelles -->
    <app-personal-data
      [user]="user()!"
      (modificationEvent)="onPersonalDataUpdate($event)">
    </app-personal-data>

    <!-- Email & mot de passe -->
    <app-credentials
      [userEmail]="user()!.email"
      (modifyEmail)="onEmailUpdate($event)"
      (modifyPassword)="onPasswordUpdate($event)">
    </app-credentials>

    <!-- Langue & devise -->
    <app-other-settings
      [languages]="languages()"
      [userLanguage]="user()!.languageCode ?? ''"
      [currencies]="currencies()"
      [userCurrency]="user()!.currencyCode ?? ''"
      (modifyOtherSettings)="onOtherSettingsUpdate($event)"
      [userNewsletter]="user()!.newsletter">
    </app-other-settings>

    <!-- Suppression de compte -->
    <app-account-data (deletionEvent)="deleteAccount()"></app-account-data>

  }

  <p-toast position="bottom-right"></p-toast>
</div>
