<p-menubar [model]="items">
  <ng-template pTemplate="start">
    <a routerLink="accueil">
      <h4 class="m-1">SVB ind - Ottawa Pigeon</h4>
    </a>
  </ng-template>

  <!-- isLogged et loggedUserName sont des Signals → appelés avec () -->
  @if (isLogged()) {
    <p-button routerLink="parametres" class="m-1">
      <span i18n="@@header.welcome">
        <i class="pi pi-cog"></i> Bonjour {{ loggedUserName() }}
      </span>
    </p-button>
    <p-button class="m-1" (click)="logOffUser()">
      <span><i class="pi pi-power-off"></i></span>
    </p-button>
  } @else {
    <p-button
      class="m-1"
      i18n-label="@@header.signIn"
      label="Accès client"
      routerLink="authentication/connexion">
    </p-button>
    <p-button
      class="m-1"
      i18n-label="@@header.signUp"
      label="Ouvrir un compte"
      routerLink="authentication/preambule">
    </p-button>
  }
</p-menubar>
